[options]
env_name = NH_center
dynamic_name = SimpleMultirotor

navigation_3d = True
using_velocity_state = False
reward_type = reward_final

;depth, lgmd, vector
perception = depth

algo = SAC
; Enable the custom GPIDE/FOCOPS sequence SAC path for NH_center 3D training.
temporal_encoder = gpide
total_timesteps = 200000

policy_name = mlp
net_arch = [64, 32, 16]
activation_function = tanh
cnn_feature_num = 25

keyboard_debug = False
; Disable per-step AirSim HUD logging for faster training; CSV/JSON logs are still saved.
print_train_info = False
generate_q_map = False
q_map_save_steps = 1000

use_wandb = False

[ablation]
; SAC ablation switch for the two innovations in this project:
;   sac                = plain SB3 SAC baseline
;   sac_gpide          = SAC + innovation 1 (PID/GPIDE-inspired sequence encoder)
;   sac_gpide_focops   = SAC + innovation 1 + innovation 2 (FOCOPS-inspired constraints)
; The loader applies this mode by overriding options.temporal_encoder and FOCOPS.enabled.
mode = sac_gpide_focops

[wandb]
name = NH-SM-3D-GPIDE-FOCOPS-SAC-M1
notes = NH_center 3D depth training

[airsim]
; AirSim RPC endpoint. Match port with ApiServerPort in the AirSim
; settings.json used by this simulator instance.
ip = 127.0.0.1
port = 41451
timeout_value = 10.0

[environment]
max_depth_meters = 15
screen_height = 60
screen_width = 90
; Number of bounded retries before falling back to the last valid AirSim image.
image_retry_count = 3
; Allow the 3D NH task enough decision steps after increasing cruise speed and
; yaw authority; this can be reduced again once success-rate stabilizes.
max_episode_steps = 1500
; Use a deterministic, farther NH_center 3D target for the trajectory plot/run
; launched by scripts/start_train_with_plot.py with this config.  Other
; environment configs keep their existing randomized goal sampling.
fixed_goal_enabled = True
fixed_goal_x = 118.0
fixed_goal_y = -124.0
fixed_goal_z = 8.0

crash_distance = 2
accept_radius = 3
accept_z_radius = 3

[curriculum]
; NH_center 3D is much harder than the 2D/maze tasks because the initial
; policy sees random yaw, random goal direction, altitude offsets and dense
; obstacles.  Start with a smaller goal square/altitude change so replay gets
; successful navigation examples, then expand to the full configured task.
enabled = True
episodes = 1500
start_ratio = 0.20
min_goal_extent = 20.0
start_z_ratio = 0.35
min_goal_z_offset_range = 0.5

[multirotor]
dt = 0.2
acc_xy_max = 2.0
v_xy_max = 8
; TD3 can exploit a zero lower speed by outputting v_xy=0 with non-zero yaw,
; which is the literal in-place spin observed on NH_center.  Keep a small
; forward-speed floor so yawing still produces translation and useful progress
; feedback.
v_xy_min = 0.8
v_z_max = 2.0 
; Randomize 3D goals in altitude so the policy must learn vertical navigation.
goal_z_offset_range = 3.0
goal_z_offset_min = 1.0
max_vertical_difference = 5.0
; Limit yaw authority for TD3/SB3 runs; 90 deg/s at dt=0.2 turns 18 degrees per
; step and easily becomes a four-direction spin before the critic learns.
yaw_rate_max_deg = 45.0

; configs for DRL algorithms
[DRL]
gamma = 0.99
learning_rate = 1e-3
learning_starts = 1000
buffer_size = 50000
batch_size = 512
train_freq = 100
gradient_steps = 100
action_noise_sigma = 0.1

[TD3]
; Keep TD3 updates very conservative for NH_center 3D.  This map has sparse
; long-horizon progress and strong obstacle-shield interventions, so even 3e-4
; can still push the deterministic actor into a low-speed yawing policy early.
gamma = 0.99
learning_rate = 1e-4
learning_starts = 10000
buffer_size = 200000
batch_size = 256
train_freq = 200
gradient_steps = 25
action_noise_sigma = 0.25

[reward]
; Stronger terminal and obstacle shaping prevents high-return crash/outside trajectories.
reward_reach = 150
reward_crash = -220
reward_outside = -150
reward_stuck = -120
reward_timeout = -80
distance_reward_coef = 160
pose_penalty_coef = 0.1
obstacle_penalty_coef = 8.0
obstacle_safe_distance = 12.0
obstacle_reward_power = 0.5
obstacle_clearance_reward_coef = 2.0
action_penalty_coef = 0.1
yaw_penalty_coef = 0.5
step_penalty = 0.02
no_progress_penalty = 0.2
progress_epsilon = 0.02
reverse_progress_penalty_coef = 0.5
turn_without_progress_penalty_coef = 0.5
min_forward_speed = 1.0
low_speed_penalty_coef = 0.1
heading_alignment_coef = 0.25
heading_error_penalty_coef = 0.3
boundary_penalty_coef = 2.0
boundary_safe_margin = 15.0
; NH_center routes require obstacle detours; straight-line path penalties
; encourage cutting into buildings before the policy learns avoidance.
path_penalty_coef = 0.0
z_boundary_safe_margin = 2.0
vertical_reward_coef = 5.0
vertical_error_penalty_coef = 0.5

[safety]
; Exploration shield used only when compact obstacle features indicate close frontal obstacles.
enabled = True
; Disable the agent-side compact-vector shield for NH_center 3D so replay
; learns from the richer environment-side depth shield instead of two stacked
; action overrides.
agent_shield_enabled = False
obstacle_shield_enabled = True
front_obstacle_threshold = 0.45
obstacle_side_threshold = 0.25
yaw_rate_bias = 1.2
speed_scale = 0.5
min_forward_speed = 1.0
obstacle_shield_min_speed = 1.0
obstacle_emergency_threshold = 0.25
; Keep moving through avoidance arcs instead of stopping in place, which can
; make the depth image flip left/right and cause infinite yaw jitter.
obstacle_emergency_speed = 0.8
obstacle_emergency_yaw_rate_bias = 1.6
obstacle_shield_turn_hold_steps = 16
obstacle_emergency_break_turn_hold = True
; Require a meaningful clearance difference before switching turn direction.
obstacle_turn_switch_margin = 1.2
; In this map/camera convention, negative yaw turns toward image-left.
obstacle_turn_clearance_sign = -1.0
obstacle_shield_z_damping = 0.35
obstacle_emergency_z_damping = 0.0
goal_turn_bias = 0.35
obstacle_goal_min_blend = 0.25
vertical_goal_bias = 0.25
goal_capture_shield_enabled = True
goal_capture_radius = 4.0
goal_capture_speed = 0.6
goal_capture_yaw_gain = 2.0
goal_capture_z_gain = 0.8
goal_approach_radius = 50.0
goal_approach_speed = 1.6
goal_approach_yaw_gain = 2.0
goal_approach_z_gain = 0.8
; Disable no-progress early termination for NH_center 3D curriculum training.
; Otherwise early curriculum episodes that are still learning to turn/climb can
; be ended as stuck before they collect useful recovery and avoidance samples.
stuck_check_enabled = False
max_no_progress_steps = 200
stuck_warmup_steps = 80
stuck_min_progress = 0.5
boundary_shield_enabled = True
boundary_shield_allow_goal_approach = True
boundary_shield_margin = 10.0
boundary_shield_z_margin = 2.0
boundary_shield_speed = 2.0
boundary_shield_z_speed = 0.5
boundary_shield_yaw_gain = 1.5

[constraint]
; Cost signal used by GPIDE/FOCOPS. Crash is always cost 1.0.
safe_distance = 12.0
obstacle_cost_power = 0.5
crash_cost = 1.0
outside_cost = 1.0
max_steps_cost = 0.3
stuck_cost = 0.6
action_cost_coef = 0.05
yaw_cost_coef = 0.05
boundary_safe_margin = 15.0
z_boundary_safe_margin = 2.0
boundary_cost_coef = 0.8

[GPIDE]
; History length consumed by the custom sequence SAC encoder.
seq_len = 16
encoder_dim = 64
embed_dim_per_head = 16
attention_heads = 1
integral_heads = 1
exp_smoothing_alphas = 0.25,0.5,1.0
decoder_hidden_size = 64
obs_encode_dim = 32
actor_hidden_sizes = 128,128
critic_hidden_sizes = 256,256
depth_splits = 9
max_grad_norm = 10.0
use_cuda = True
torch_num_threads = 1
reward_history_scale = 100.0

[FOCOPS]
; FOCOPS-inspired safety/trust-region settings for the sequence SAC agent.
enabled = True
cost_gamma = 0.99
cost_limit = 0.02
nu = 1.0
nu_lr = 0.05
nu_max = 10.0
eta = 0.02
kl_coef = 1.0
cost_penalty_coef = 2.0
policy_snapshot_interval = 25
