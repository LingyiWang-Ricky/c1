[options]
env_name = City_400
dynamic_name = SimpleMultirotor

navigation_3d = False
using_velocity_state = False
reward_type = reward_final

; depth, lgmd, vector
perception = depth

algo = SAC
; Use the local GPIDE/FOCOPS sequence SAC path for the large City_400 task.
temporal_encoder = gpide
total_timesteps = 200000

policy_name = mlp
net_arch = [64, 32, 16]
activation_function = tanh
cnn_feature_num = 25

keyboard_debug = False
print_train_info = False
generate_q_map = False
q_map_save_steps = 10000

use_wandb = False


[ablation]
; SAC ablation switch for the two innovations in this project:
;   sac                = plain SB3 SAC baseline
;   sac_gpide          = SAC + innovation 1 (PID/GPIDE-inspired sequence encoder)
;   sac_gpide_focops   = SAC + innovation 1 + innovation 2 (FOCOPS-inspired constraints)
; The loader applies this mode by overriding options.temporal_encoder and FOCOPS.enabled.
mode = sac_gpide_focops

[wandb]
name = City-400-2D-GPIDE-FOCOPS-SAC-M1
notes = City_400 2D depth GPIDE curriculum training

[airsim]
; AirSim RPC endpoint. Match port with ApiServerPort in the AirSim
; settings.json used by this simulator instance.
ip = 127.0.0.1
port = 41451
timeout_value = 10.0

[environment]
max_depth_meters = 20
screen_height = 60
screen_width = 90
image_retry_count = 3
; City_400 goals can be over 200 m away and may require obstacle detours.
max_episode_steps = 1500

crash_distance = 2
accept_radius = 3

[curriculum]
; Start with a smaller goal square around the city center, then expand to the
; full City_400 boundary.  This prevents early replay from being dominated by
; very long random-goal failures before the policy learns basic navigation.
enabled = True
episodes = 800
start_ratio = 0.35
min_goal_extent = 45.0

[multirotor]
dt = 0.2
acc_xy_max = 2.0
v_xy_max = 8
v_xy_min = 1.0
v_z_max = 2.0 
yaw_rate_max_deg = 60.0

; configs for DRL algorithms
[DRL]
gamma = 0.99
learning_rate = 1e-3
learning_starts = 1000
buffer_size = 50000
batch_size = 512
train_freq = 100
gradient_steps = 100
action_noise_sigma = 0.1

[reward]
reward_reach = 150
reward_crash = -220
reward_outside = -150
reward_stuck = -120
reward_timeout = -80
distance_reward_coef = 120
pose_penalty_coef = 0.05
obstacle_penalty_coef = 2.0
action_penalty_coef = 0.08
yaw_penalty_coef = 0.3
step_penalty = 0.02
no_progress_penalty = 0.1
progress_epsilon = 0.02
reverse_progress_penalty_coef = 0.3
min_forward_speed = 2.0
low_speed_penalty_coef = 0.2
heading_alignment_coef = 0.2
heading_error_penalty_coef = 0.15
boundary_penalty_coef = 2.0
boundary_safe_margin = 15.0
; City routes often require detours around buildings, so do not punish leaving
; the straight start-goal line.
path_penalty_coef = 0.0

[safety]
enabled = True
front_obstacle_threshold = 0.35
yaw_rate_bias = 1.0
speed_scale = 0.7
min_forward_speed = 2.0
goal_turn_bias = 0.2
; TD3 keeps a positive forward-speed lower bound, so near-goal episodes can
; orbit around the marker without ever reducing yaw/speed enough to enter the
; small acceptance radius.  Enable the environment-side capture shield for this
; City_400 multirotor task so final approach explicitly points at the sampled
; goal and slows down only near the target.
goal_capture_shield_enabled = True
goal_capture_radius = 8.0
goal_capture_speed = 1.0
goal_capture_yaw_gain = 2.0
goal_approach_radius = 35.0
goal_approach_speed = 2.0
goal_approach_yaw_gain = 1.5
stuck_check_enabled = False
max_no_progress_steps = 250
stuck_warmup_steps = 100
stuck_min_progress = 0.5
boundary_shield_enabled = True
boundary_shield_margin = 12.0
boundary_shield_speed = 2.0
boundary_shield_yaw_gain = 1.5

[constraint]
safe_distance = 8.0
crash_cost = 1.0
outside_cost = 1.0
max_steps_cost = 0.3
stuck_cost = 0.6
action_cost_coef = 0.05
yaw_cost_coef = 0.05
boundary_safe_margin = 15.0
boundary_cost_coef = 0.8

[GPIDE]
seq_len = 16
encoder_dim = 64
embed_dim_per_head = 16
attention_heads = 1
integral_heads = 1
exp_smoothing_alphas = 0.25,0.5,1.0
decoder_hidden_size = 64
obs_encode_dim = 32
actor_hidden_sizes = 128,128
critic_hidden_sizes = 256,256
depth_splits = 9
max_grad_norm = 10.0
use_cuda = True
torch_num_threads = 1
reward_history_scale = 100.0

[FOCOPS]
enabled = True
cost_gamma = 0.99
cost_limit = 0.04
nu = 0.5
nu_lr = 0.03
nu_max = 10.0
eta = 0.02
kl_coef = 1.0
cost_penalty_coef = 0.5
policy_snapshot_interval = 25
