[options]
env_name = SimpleAvoid
dynamic_name = SimpleMultirotor

navigation_3d = False
using_velocity_state = False
reward_type = reward_final

;depth, lgmd, vector
perception = depth

algo = SAC
; Enable the custom GPIDE/FOCOPS sequence SAC path by default.
temporal_encoder = gpide
total_timesteps = 100000

policy_name = mlp
net_arch = [64, 32, 16]
activation_function = tanh
cnn_feature_num = 25

keyboard_debug = False
; Disable per-step AirSim HUD logging for faster GPIDE training; CSV/JSON logs are still saved.
print_train_info = False
generate_q_map = True
q_map_save_steps = 10000

use_wandb = False

[wandb]
name = Maze-2D-mlp-tanh-M3
notes = test

[environment]
max_depth_meters = 15
screen_height = 60
screen_width = 90
; Number of bounded retries before falling back to the last valid AirSim image.
image_retry_count = 3

crash_distance = 2
accept_radius = 2

[multirotor]
dt = 0.1
acc_xy_max = 2.0
v_xy_max = 5
v_xy_min = 0.5
v_z_max = 2.0 
yaw_rate_max_deg = 30.0

; configs for DRL algorithms
[DRL]
gamma = 0.99
learning_rate = 1e-3
learning_starts = 1000
buffer_size = 50000
batch_size = 512
train_freq = 100
gradient_steps = 100
action_noise_sigma = 0.1


[reward]
; Stronger terminal and obstacle shaping prevents high-return crash trajectories.
reward_reach = 80
reward_crash = -150
reward_outside = -100
reward_timeout = -50
distance_reward_coef = 50
pose_penalty_coef = 0.1
obstacle_penalty_coef = 2.0
action_penalty_coef = 0.1
yaw_penalty_coef = 0.5

[safety]
; Exploration shield used only when compact obstacle features indicate close frontal obstacles.
enabled = True
front_obstacle_threshold = 0.45
yaw_rate_bias = 0.7
speed_scale = 0.35

[constraint]
; Cost signal used by GPIDE/FOCOPS. Crash is always cost 1.0.
safe_distance = 5.0
crash_cost = 1.0
outside_cost = 0.5
action_cost_coef = 0.05
yaw_cost_coef = 0.05

[GPIDE]
; History length consumed by the custom sequence SAC encoder.
seq_len = 16
encoder_dim = 64
embed_dim_per_head = 16
attention_heads = 1
integral_heads = 1
exp_smoothing_alphas = 0.25,0.5,1.0
decoder_hidden_size = 64
obs_encode_dim = 32
actor_hidden_sizes = 128,128
critic_hidden_sizes = 256,256
depth_splits = 5
max_grad_norm = 10.0
use_cuda = True
torch_num_threads = 1
reward_history_scale = 100.0

[FOCOPS]
; FOCOPS-inspired safety/trust-region settings for the sequence SAC agent.
enabled = True
cost_gamma = 0.99
cost_limit = 0.03
nu = 1.0
nu_lr = 0.05
nu_max = 10.0
eta = 0.02
kl_coef = 1.0
cost_penalty_coef = 1.0
policy_snapshot_interval = 25
