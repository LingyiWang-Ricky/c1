[options]
env_name = SimpleAvoid
dynamic_name = SimpleMultirotor

navigation_3d = False
using_velocity_state = False
reward_type = reward_final

;depth, lgmd, vector
perception = depth

algo = SAC
; Enable the custom GPIDE/FOCOPS sequence SAC path by default.
temporal_encoder = gpide
total_timesteps = 100000

policy_name = mlp
net_arch = [64, 32, 16]
activation_function = tanh
cnn_feature_num = 25

keyboard_debug = False
generate_q_map = True
q_map_save_steps = 10000

use_wandb = False

[wandb]
name = Maze-2D-mlp-tanh-M3
notes = test

[environment]
max_depth_meters = 15
screen_height = 60
screen_width = 90

crash_distance = 2
accept_radius = 2

[multirotor]
dt = 0.1
acc_xy_max = 2.0
v_xy_max = 5
v_xy_min = 0.5
v_z_max = 2.0 
yaw_rate_max_deg = 30.0

; configs for DRL algorithms
[DRL]
gamma = 0.99
learning_rate = 1e-3
learning_starts = 2000
buffer_size = 50000
batch_size = 512
train_freq = 100
gradient_steps = 100
action_noise_sigma = 0.1

[GPIDE]
; History length consumed by the custom sequence SAC encoder.
seq_len = 16
encoder_dim = 64
embed_dim_per_head = 16
attention_heads = 1
integral_heads = 1
exp_smoothing_alphas = 0.25,0.5,1.0
decoder_hidden_size = 64
obs_encode_dim = 32
actor_hidden_sizes = 128,128
critic_hidden_sizes = 256,256
depth_splits = 5
max_grad_norm = 10.0
use_cuda = True
torch_num_threads = 1

[FOCOPS]
; FOCOPS-inspired safety/trust-region settings for the sequence SAC agent.
enabled = True
cost_gamma = 0.99
cost_limit = 0.12
nu = 0.0
nu_lr = 0.01
nu_max = 10.0
eta = 0.02
kl_coef = 1.0
policy_snapshot_interval = 25
